<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="품질 CBT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1f4f9c">
<title>품질관리 CBT 모의고사</title>
<style>
:root{--bg:#f3f5f8;--sf:#fff;--tx:#1b2430;--mu:#5b6675;--ln:#cfd6e0;--ac:#1f4f9c;--acs:#dce8fb;--ok:#1d7a46;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--sf:#1d2530;--tx:#e8edf3;--mu:#9aa6b6;--ln:#344052;--ac:#7fb0ff;--acs:#23385a;--ok:#5fd193;--no:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a22;--sf:#1d2530;--tx:#e8edf3;--mu:#9aa6b6;--ln:#344052;--ac:#7fb0ff;--acs:#23385a;--ok:#5fd193;--no:#ff8a80;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:12px 18px;min-height:44px}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
@media (prefers-color-scheme:dark){.btn{color:#0c1624}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 220px;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.q{font-size:1.05rem;font-weight:600;margin:0 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:12px;margin-bottom:8px;min-height:48px;font-size:16px}
.opt.sel{background:var(--acs);border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:transparent;box-shadow:inset 0 0 0 1px var(--ok)}
.opt.bad{border-color:var(--no);box-shadow:inset 0 0 0 1px var(--no)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav button{border:1px solid var(--ln);background:var(--sf);border-radius:4px;padding:11px 0;min-height:44px}
.nav .done{background:var(--acs);border-color:var(--ac)}
.nav .cur{outline:2px solid var(--ac)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mu{color:var(--mu);font-size:.9rem}
.tag{display:inline-block;font-size:.8rem;color:var(--mu);border:1px solid var(--ln);border-radius:4px;padding:0 6px;margin-bottom:8px}
.score{font-size:2.4rem;font-weight:700}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// [문제, [보기], 정답(1~), 구분] 구분: a=1~7주차, b=8~15주차
let Q=[];;
const app=document.getElementById("app");
let S;
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function home(){
  clearInterval(S&&S.t);
  app.innerHTML=`<h1>품질관리 CBT 모의고사</h1><div class="card"><p>1~15주차 퀴즈 자료에서 뽑은 객관식 ${Q.length}문제입니다. 5지·7지선다 문제는 보기를 그대로 표시합니다. 정답은 제출 후에 공개됩니다.</p><div class="row"><button class="btn" id="all">전체 풀기 (${Q.length}문항)</button><button class="btn sec" id="wk">1~7주차 범위만 (${Q.filter(q=>q[3]=="a").length}문항)</button></div></div>`;
  document.getElementById("all").onclick=()=>start(false);
  document.getElementById("wk").onclick=()=>start(true);
}
function start(onlyA){
  const list=Q.filter(q=>!onlyA||q[3]=="a").map(q=>q.slice()).sort(()=>Math.random()-.5);
  S={list,ans:Array(list.length).fill(0),i:0,sec:0,t:setInterval(()=>{S.sec++;const e=document.getElementById("tm");if(e)e.textContent=fmt(S.sec)},1000)};
  quiz();
}
function quiz(){
  const q=S.list[S.i],n=S.list.length,done=S.ans.filter(x=>x).length;
  app.innerHTML=`<div class="bar"><strong>문제 ${S.i+1} / ${n}</strong><span class="mu">푼 문제 ${done}/${n} · 경과 <span id="tm">${fmt(S.sec)}</span></span></div>
  <div class="grid"><div class="card"><span class="tag">${q[3]=="a"?"1~7주차":"8~15주차"}</span><p class="q">${esc(q[0])}</p>
  ${q[1].map((o,k)=>`<button class="opt ${S.ans[S.i]==k+1?"sel":""}" data-k="${k+1}"><span>${"①②③④⑤⑥⑦"[k]}</span><span>${esc(o)}</span></button>`).join("")}
  ${S.warn?`<p style="color:var(--no);margin:8px 0 0">풀지 않은 문제가 ${n-done}개 있습니다. 제출을 한 번 더 누르면 채점합니다.</p>`:""}<div class="row"><button class="btn sec" id="pv" ${S.i==0?"disabled":""}>이전</button><button class="btn sec" id="nx" ${S.i==n-1?"disabled":""}>다음</button><button class="btn" id="sb">답안 제출</button></div></div>
  <div class="card"><div class="mu" style="margin-bottom:8px">문제 이동</div><div class="nav">${S.list.map((_,k)=>`<button data-g="${k}" class="${S.ans[k]?"done":""} ${k==S.i?"cur":""}">${k+1}</button>`).join("")}</div></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.k;S.warn=false;quiz()});
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.g;quiz()});
  document.getElementById("pv").onclick=()=>{S.i--;quiz()};
  document.getElementById("nx").onclick=()=>{S.i++;quiz()};
  document.getElementById("sb").onclick=()=>{if(n-done==0||S.warn){S.warn=false;result()}else{S.warn=true;quiz()}};
}
function result(){
  clearInterval(S.t);
  const n=S.list.length,ok=S.list.filter((q,k)=>S.ans[k]==q[2]).length;
  const wrong=S.list.map((q,k)=>[q,k]).filter(([q,k])=>S.ans[k]!=q[2]);
  app.innerHTML=`<h1>결과</h1><div class="card"><div class="score">${Math.round(ok/n*100)}점</div><p class="mu">${n}문제 중 ${ok}문제 정답 · 소요 시간 ${fmt(S.sec)}</p><div class="row"><button class="btn" id="rt">처음으로</button></div></div>
  <h2 style="font-size:1.1rem;margin:16px 0 8px">틀린 문제 ${wrong.length}개</h2>
  ${wrong.map(([q,k])=>`<div class="card" style="margin-bottom:10px"><p class="q">${k+1}. ${esc(q[0])}</p>${q[1].map((o,j)=>`<div class="opt ${j+1==q[2]?"ok":j+1==S.ans[k]?"bad":""}"><span>${"①②③④⑤⑥⑦"[j]}</span><span>${esc(o)}${j+1==q[2]?" (정답)":j+1==S.ans[k]?" (내 답)":""}</span></div>`).join("")}${S.ans[k]?"":'<p class="mu">미응답</p>'}</div>`).join("")||'<div class="card">모두 맞혔습니다.</div>'}`;
  document.getElementById("rt").onclick=home;
}
function load(u){return fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()})}
load("questions.json").catch(()=>load("questions.sample.json")).then(d=>{Q=d.map(x=>[x.q,x.o,x.a,x.w]);home()}).catch(()=>{app.textContent="문제 파일을 불러오지 못했습니다."});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
